# Base URL of the application under test
base.url=http://localhost:3000

# Playwright browser: chromium | firefox | webkit
playwright.browser=chromium

# Headless mode: true | false
playwright.headless=true

# Slow-motion delay in milliseconds (0 = off)
playwright.slow_mo=0

# Explicit wait timeout in seconds
explicit.wait.seconds=10

# Screenshot on test failure
screenshot.on.failure=true

# ── Test Data — Banking Login Suite ──────────────────────────────────────────
# TC_001 / TC_002 — valid credentials
banking.valid.username=admin
banking.valid.password=SecurePass123!

# TC_001 OTP (MFA)
banking.valid.otp=123456

# TC_003 — invalid username
banking.invalid.username=no_such_user

# TC_004 — valid username but wrong password
banking.invalid.password.user=admin
banking.invalid.password=WrongPassword!

# TC_005 — both invalid
banking.both.invalid.username=bad_user
banking.both.invalid.password=bad_pass
