# Base URL of the application under test — mock_aut/server.js.
#
# Left at loopback deliberately, so this project stays runnable by hand:
#   cd mock_aut && node server.js     # then: mvn test
#
# Inside the compose stack the AUT is a *service*, not loopback, and svc-runner passes its
# address in as the BASE_URL environment variable. ConfigReader's order is system property
# (-Dbase.url=…), then environment (BASE_URL), then this file — so the container overrides
# the line below without editing it, and `localhost` never has to be believed in a place
# where it means "this container". See ADR §6.27.
base.url=http://localhost:3000

# Playwright browser: chromium | firefox | webkit
playwright.browser=chromium

# Headless mode: true | false
playwright.headless=true

# Slow-motion delay in milliseconds (0 = off)
playwright.slow_mo=0

# Explicit wait timeout in seconds
explicit.wait.seconds=10

# Screenshot on test failure
screenshot.on.failure=true

# ── Test Data — Banking Login Suite ──────────────────────────────────────────
# Every value here must exist in mock_aut/server.js's credential store, and until the AUT
# was actually reachable nothing checked that. `banking.valid.username` was `admin` —
# which mock_aut does recognise, but on the *other* form on that page: `admin`/`password`
# posts to /system/login, while the banking form the page objects drive posts to
# /banking/login and knows john.doe@bank.com. So TC_001 would have failed on a reachable
# AUT with the confident-looking message "Invalid username or password", and the cause
# would have read as an application defect. tests/test_mock_aut_wiring.py now asserts the
# two files agree.

# TC_001 — direct login, no second factor (mock_aut: → /dashboard)
banking.valid.username=john.doe@bank.com
banking.valid.password=SecurePass123!

# TC_002 — MFA login. A *different* user, and it has to be: one credential pair cannot
# both skip the second factor (TC_001) and trigger it (TC_002), and mock_aut models that
# the way an application would — mfa.user@bank.com routes to the /otp interstitial.
banking.mfa.username=mfa.user@bank.com
banking.mfa.password=MfaPass456!

# TC_002 OTP
banking.valid.otp=123456

# TC_003 — invalid username
banking.invalid.username=no_such_user

# TC_004 — valid username but wrong password. The username must be the real one, or this
# case tests TC_005's condition under TC_004's name.
banking.invalid.password.user=john.doe@bank.com
banking.invalid.password=WrongPassword!

# TC_005 — both invalid
banking.both.invalid.username=bad_user
banking.both.invalid.password=bad_pass
